#
# Release packaging for the HeartKit vitals demo (see #6).
#
# Runs tools/release/package.sh for the three release boards, uploads the
# resulting zips as workflow artifacts, and attaches them to a DRAFT GitHub
# release. Publication stays manual: the hardware validation gate is recorded
# by hand in the release notes before anyone presses publish.
#
# macOS runner: package.sh regenerates THIRD-PARTY-NOTICES.md, which converts
# the AmbiqSuite agreement from RTF with `textutil`. Only macOS has it.
name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to package, for example v5.0.0"
        required: true
        type: string

permissions:
  contents: read

jobs:
  package:
    name: package firmware drop
    runs-on: macos-latest
    permissions:
      contents: write
    env:
      UV_VERSION: "0.11.26"
      # SHA-256 as published by Arm next to the archive at
      # https://developer.arm.com/-/media/Files/downloads/gnu/15.2.Rel1/binrel/
      # <archive>.sha256asc
      ARM_TOOLCHAIN_VERSION: "15.2.Rel1"
      ARM_TOOLCHAIN_HOST: "darwin-arm64"
      ARM_TOOLCHAIN_SHA256: "1938a84b7105c192e3fb4fa5e893ba25f425f7ddab40515ae608cd40f68669a8"
      RELEASE_BOARDS: "apollo510b_evb,apollo510_evb,apollo330mP_evb"
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve the version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            version="${GITHUB_REF_NAME}"
          else
            version="${INPUT_VERSION}"
          fi
          if [ -z "${version}" ]; then
            echo "::error::no version resolved from the tag or the workflow input"
            exit 1
          fi
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "Packaging ${version}"

      - name: Require the module token
        env:
          NSX_MODULE_TOKEN: ${{ secrets.NSX_MODULE_TOKEN }}
        run: |
          if [ -z "${NSX_MODULE_TOKEN}" ]; then
            echo "::error::NSX_MODULE_TOKEN secret is not set"
            echo "NSX_MODULE_TOKEN secret is not set" >&2
            echo "Add a repository secret with read access to the private" >&2
            echo "AmbiqAI NSX module repositories listed in nsx.lock." >&2
            exit 1
          fi
          echo "NSX_MODULE_TOKEN is set"

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Install the Arm GNU Toolchain
        run: |
          set -euo pipefail
          archive="arm-gnu-toolchain-${ARM_TOOLCHAIN_VERSION}-${ARM_TOOLCHAIN_HOST}-arm-none-eabi.tar.xz"
          url="https://developer.arm.com/-/media/Files/downloads/gnu/${ARM_TOOLCHAIN_VERSION}/binrel/${archive}"
          dest="${RUNNER_TEMP}/${archive}"
          curl --fail --location --silent --show-error --retry 3 --output "${dest}" "${url}"
          echo "${ARM_TOOLCHAIN_SHA256}  ${dest}" | shasum -a 256 --check --strict -
          mkdir -p "${RUNNER_TEMP}/arm-gnu-toolchain"
          tar -xf "${dest}" -C "${RUNNER_TEMP}/arm-gnu-toolchain" --strip-components=1
          echo "${RUNNER_TEMP}/arm-gnu-toolchain/bin" >> "${GITHUB_PATH}"

      - name: Record the toolchain version
        run: arm-none-eabi-gcc --version

      - name: Vendor the locked modules
        env:
          NSX_MODULE_TOKEN: ${{ secrets.NSX_MODULE_TOKEN }}
        run: |
          set -euo pipefail
          git config --global \
            "url.https://x-access-token:${NSX_MODULE_TOKEN}@github.com/.insteadOf" \
            "https://github.com/"
          uv run nsx sync --app-dir . --frozen

      - name: Package the three boards
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: tools/release/package.sh --version "${VERSION}" --boards "${RELEASE_BOARDS}"

      - name: Upload the zips as workflow artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: firmware-drop-${{ steps.version.outputs.version }}
          path: dist/*.zip
          if-no-files-found: error

      - name: Attach the zips to a draft release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          notes="${RUNNER_TEMP}/release-notes.md"
          {
            echo "Draft build of ${VERSION} from ${GITHUB_SHA}."
            echo
            echo "Boards: ${RELEASE_BOARDS}."
            echo
            echo "Hardware validation is not recorded yet. Add the validation"
            echo "statement per board to these notes before publishing."
          } > "${notes}"
          if gh release view "${VERSION}" >/dev/null 2>&1; then
            gh release upload "${VERSION}" dist/*.zip --clobber
          else
            gh release create "${VERSION}" \
              --draft \
              --target "${GITHUB_SHA}" \
              --title "${VERSION}" \
              --notes-file "${notes}" \
              dist/*.zip
          fi
