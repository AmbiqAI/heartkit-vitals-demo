#
# heliaAOT conversion of the ECG arrhythmia model. Regenerate with
# tools/aot/convert.sh; paths are relative to the repo root.
#
#   helia-aot 0.19.0
#   assets/arrhythmia.tflite
#     sha256 a1855af0e0b2a346d773e0d36ff8c8b986c51db4aed99a6066c9da9f23f12eab
#     (matches model_sha256 in tools/aot/golden/golden-arr.json)
model:
  path: assets/arrhythmia.tflite
  subgraph: 0
  name: hkv_arrhythmia
module:
  path: modules
  type: nsx
  name: hkv_arrhythmia_aot
  prefix: hkv_arrhythmia
platform:
  name: apollo510b_evb
memory:
  # Mirrors the TFLM layout the adapters use today: weights cold in MRAM (XIP
  # .rodata), working arena in shared SRAM. tools/aot/hkv_aot_attributes.h maps
  # the SRAM arena onto the same `.shared` section as AM_SHARED_RW. TCM
  # placement is a later optimization. The rule type is matched against the
  # lowercase AIR tensor kind, so `CONSTANT` silently matches nothing.
  tensors:
  - type: scratch
    attributes:
      memory: SRAM
  - type: constant
    attributes:
      memory: MRAM
  # Emits <prefix>_residency.json next to the module as placement evidence.
  dump_residency_json: true
test:
  enabled: true
  golden_data: tools/aot/golden/golden-arr.npz
  # float32 softmax output; about 2 LSB of the int8 1/256 probability scale.
  tolerance: 0.008
